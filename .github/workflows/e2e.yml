name: e2e

# Packs the package once, then installs that tarball from a local registry with bunx
# on every OS. Callers publish this
# exact artifact, so what ships is what was tested.
on:
  workflow_call:
    inputs:
      pack-only:
        description: "Pack the tarball and skip the install matrix (the commit already passed it in ci)."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pack:
    name: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: mkdir -p dist && bun pm pack --destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: dist/*.tgz
          if-no-files-found: error

  e2e:
    name: e2e (${{ matrix.os }}, node ${{ matrix.node }})
    needs: pack
    if: ${{ !inputs.pack-only }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22"]
        include:
          - os: ubuntu-latest
            node: "24"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: dist
      - name: e2e against the packed tarball
        env:
          REPO_E2E_ROOT: ${{ runner.temp }}/repo-e2e
          REPO_E2E_KEEP: "1"
        run: |
          mkdir -p "$REPO_E2E_ROOT"
          REPO_E2E_TARBALL="$(ls dist/*.tgz)" bun run test:e2e
      - name: upload e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            ${{ runner.temp }}/repo-e2e/**/logs/**
            ${{ runner.temp }}/repo-e2e/**/verdaccio.log
          if-no-files-found: ignore

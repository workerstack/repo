# @generated by @workerstack/repo
name: eval

on:
  workflow_dispatch:
    inputs:
      eval:
        description: The eval's name under evals
        required: true
        type: string
      max-cost:
        description: The most the run may spend, in US dollars; empty takes 5 for session and 1 for api
        required: false
        type: string
        default: ""
      via:
        description: How the eval is paid for, the Claude Code session or the API key
        required: true
        type: choice
        options:
          - session
          - api
        default: session

concurrency:
  group: eval-${{ inputs.eval }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: evals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .repo/tmp/evals/cache
          key: evals-${{ inputs.eval }}-${{ github.run_id }}
          restore-keys: evals-${{ inputs.eval }}-
      - name: Install Claude Code
        if: inputs.via == 'session'
        run: npm install -g @anthropic-ai/claude-code@2.1.323
      - name: Run the eval
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          EVAL: ${{ inputs.eval }}
          MAX_COST: ${{ inputs.max-cost }}
          VIA: ${{ inputs.via }}
        run: bun repo eval "$EVAL" --via "$VIA" ${MAX_COST:+--max-cost "$MAX_COST"}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .repo/tmp/evals/cache
          key: evals-${{ inputs.eval }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-${{ inputs.eval }}
          path: .repo/tmp/evals/runs
          if-no-files-found: ignore

# @generated by @workerstack/repo
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.label }})
    if: github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1/2, label: ubuntu-latest 1/2 }
          - { os: ubuntu-latest, shard: 2/2, label: ubuntu-latest 2/2 }
          - { os: windows-latest, shard: 1/6, label: windows-latest 1/6 }
          - { os: windows-latest, shard: 2/6, label: windows-latest 2/6 }
          - { os: windows-latest, shard: 3/6, label: windows-latest 3/6 }
          - { os: windows-latest, shard: 4/6, label: windows-latest 4/6 }
          - { os: windows-latest, shard: 5/6, label: windows-latest 5/6 }
          - { os: windows-latest, shard: 6/6, label: windows-latest 6/6 }
          - { os: macos-latest, shard: 1/3, label: macos-latest 1/3 }
          - { os: macos-latest, shard: 2/3, label: macos-latest 2/3 }
          - { os: macos-latest, shard: 3/3, label: macos-latest 3/3 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Remove node
        if: runner.os == 'Linux'
        run: |
          sudo rm -f $(which -a node nodejs)
          sudo rm -rf /opt/hostedtoolcache/node
          hash -r
      - name: Assert node is gone
        if: runner.os == 'Linux'
        run: |
          if command -v node; then echo "node is still on PATH"; exit 1; fi
      - name: Refuse to run as root
        if: runner.os != 'Windows'
        run: |
          if [ "$(id -u)" = "0" ]; then echo "CI must run as a non-root user; the suite assumes unprivileged file permissions"; exit 1; fi
      - run: bun install --frozen-lockfile
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tmp/repo/tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ github.sha }}
          restore-keys: tsbuildinfo-${{ runner.os }}-
      - name: Run the gates and write the skip report
        shell: bash
        env:
          REPORT: ci-report-${{ runner.os }}-${{ strategy.job-index }}.json
          COVERAGE: ${{ runner.os != 'Linux' && '--no-coverage' || '' }}
          SHARD: ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}
        run: bun repo ci --report "$REPORT" $COVERAGE $SHARD
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: .tmp/repo/tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-report-${{ matrix.os }}-${{ strategy.job-index }}
          path: ci-report-${{ runner.os }}-${{ strategy.job-index }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: blob-${{ strategy.job-index }}
          path: .tmp/repo/blob/
          if-no-files-found: error

  commits:
    name: commits
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Check every pushed commit
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun repo commit-msg --range "$BASE..HEAD"

  skips:
    name: skips
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-report-*
          merge-multiple: true
          path: reports
      - run: bun repo ci skips reports

  coverage:
    name: coverage
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-*
          merge-multiple: true
          path: blobs
      - run: bun repo ci merge blobs

  e2e:
    name: e2e (${{ matrix.label }})
    if: github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: "", label: ubuntu-latest }
          - { os: windows-latest, shard: 1/3, label: windows-latest 1/3 }
          - { os: windows-latest, shard: 2/3, label: windows-latest 2/3 }
          - { os: windows-latest, shard: 3/3, label: windows-latest 3/3 }
          - { os: macos-latest, shard: "", label: macos-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Remove node
        if: runner.os == 'Linux'
        run: |
          sudo rm -f $(which -a node nodejs)
          sudo rm -rf /opt/hostedtoolcache/node
          hash -r
      - name: Assert node is gone
        if: runner.os == 'Linux'
        run: |
          if command -v node; then echo "node is still on PATH"; exit 1; fi
      - run: bun install --frozen-lockfile
      - name: Run the e2e tests
        env:
          SHARD: ${{ matrix.shard && format('--shard={0} --passWithNoTests', matrix.shard) || '' }}
        run: bun run test:e2e $SHARD

  consumer:
    name: consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun repo release consumer
      - run: bun repo release api

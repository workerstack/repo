# @generated by @workerstack/repo
name: bench

on:
  workflow_dispatch:
    inputs:
      spec:
        description: The spec's name under .repo/bench
        required: true
        type: string
      os:
        description: The runner labels to measure on, as a JSON array
        required: true
        type: string
      sha:
        description: The commit to check out and measure
        required: true
        type: string

concurrency:
  group: bench-${{ inputs.spec }}-${{ inputs.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bench:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Run the spec
        shell: bash
        env:
          SPEC: ${{ inputs.spec }}
        run: bun repo bench "$SPEC"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ inputs.spec }}-${{ matrix.os }}
          path: .repo/tmp/bench/${{ inputs.spec }}/${{ matrix.os }}.json
          if-no-files-found: error
